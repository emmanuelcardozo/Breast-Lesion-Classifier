[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-lesion-classifier"
version = "0.1.0"
description = "Clasificador académico de lesiones mamarias en ecografía"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Emmanuel Cardozo"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "scikit-learn>=1.4,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.7,<1", "mypy>=1.11,<2"]
deep-learning = ["torch>=2.3,<2.4", "torchvision>=0.18,<0.19", "timm>=1,<2", "monai>=1.4,<2"]
explainability = ["grad-cam>=1.5,<2", "imagehash>=4.3,<5"]
tracking = ["mlflow>=2.17,<4"]

[project.scripts]
breast-lesion-classifier = "breast_lesion_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
